<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.webmanifest"><title>Tafelhelden</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff6ff;color:#172554;font:18px system-ui,sans-serif}main{max-width:700px;margin:auto;padding:20px}h1{font-size:2.5rem}.card{background:white;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 3px 20px #17255415}label{display:block;margin:18px 0 8px;font-weight:700}button,select,input{font:inherit;border:2px solid #cbd5e1;border-radius:12px;padding:13px;background:white;color:inherit}button{cursor:pointer;touch-action:manipulation}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{min-width:60px}.chips .active{background:#bfdbfe;border-color:#2563eb}select,input{width:100%}.primary{background:#2563eb;color:white;border:0;width:100%;padding:18px;font-weight:700;margin-top:12px}.hidden{display:none!important}.question{text-align:center;font-size:clamp(45px,11vw,85px);font-weight:800;margin:30px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices button{font-size:2rem;padding:25px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.keypad button{font-size:1.5rem}#typed{text-align:center;font-size:2rem}#feedback{text-align:center;font-weight:700;min-height:32px;margin:16px}small{color:#64748b}#history{white-space:pre-line}
#rewardbar{position:sticky;bottom:0;background:#dbeafe;border:2px solid #93c5fd;border-radius:18px;padding:12px;text-align:center;z-index:5;box-shadow:0 -3px 15px #17255412}#stars{font-size:2rem;letter-spacing:8px}#tableStats{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px}.stat{background:#eff6ff;border-radius:12px;padding:12px;text-align:center}#joke{background:#fef9c3;border-radius:16px;padding:16px;font-size:1.3rem;margin:16px 0}body{padding-bottom:12px}</style></head><body><main><h1>⭐ Tafelhelden</h1><p>Word een tafelheld!</p><section id="setup" class="card"><h2>Kies je oefening</h2><label>Tafels</label><div id="tables" class="chips"></div><p><button id="all">Alle tafels</button> <button id="none">Wissen</button></p><label>Volgorde</label><select id="order"><option value="ordered">Op volgorde</option><option value="random">Shuffle</option></select><label>Antwoorden</label><select id="mode"><option value="choice">Multiplechoice</option><option value="type">Cijfers invoeren</option><option value="mix">Afwisselend</option></select><label>Aantal vragen</label><select id="count"><option>10</option><option>20</option><option>30</option><option value="all">Alle sommen</option></select><p><small>We oefenen van ×1 tot ×10.</small></p><button id="start" class="primary">Start oefenen</button><p id="error"></p></section><section id="quiz" class="card hidden"><p><strong id="progress"></strong> · <strong id="score"></strong></p><div class="question" id="question"></div><div id="choices" class="choices"></div><div id="entry" class="hidden"><input id="typed" readonly aria-label="Ingevuld antwoord"><div id="keypad" class="keypad"></div><button id="check" class="primary">Controleer</button></div><div id="feedback" aria-live="polite"></div><button id="next" class="primary hidden">Volgende vraag</button><p><button id="stop">Stoppen</button></p></section><section id="result" class="card hidden"><h2>Goed geoefend! 🎉</h2><p id="summary"></p><div id="mistakes"></div><div id="joke" class="hidden"></div><button id="again" class="primary">Opnieuw</button></section><section class="card"><h2>Voortgang</h2><p id="history">Nog geen resultaten</p><h3>Afgeronde tafels</h3><div id="tableStats"></div><button id="clear">Voortgang wissen</button></section><div id="rewardbar"><strong>Sparen voor een mop: <span id="streakText">0/3</span></strong><div id="stars">☆☆☆</div><small>Drie foutloze rondes op rij = een mop!</small></div></main><script>
(()=>{
const $=id=>document.getElementById(id),selected=new Set([2,3,4,5]);
let questions=[],index=0,correct=0,errors=[],answered=false,currentMode="choice";
const jokes=[
"Waarom kan een fiets niet alleen staan? Omdat hij twee-takt!",
"Wat zegt een nul tegen een acht? Mooie riem!",
"Waarom nam de computer een jas mee? Omdat Windows openstond!",
"Wat is groen en rijdt van een berg af? Een skiwi!",
"Waarom is een boek zo slim? Omdat het vol verhalen zit!",
"Wat zegt een sneeuwpop tegen een andere sneeuwpop? Ruik jij ook wortels?",
"Wat doet een koe op een trampoline? Milkshake maken!",
"Waarom ging de banaan naar de dokter? Hij voelde zich niet lekker in zijn schil!",
"Wat is geel en kan niet zwemmen? Een graafmachine!",
"Waarom zijn spoken slechte leugenaars? Je kijkt dwars door ze heen!"
];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function load(){try{return JSON.parse(localStorage.getItem("tafelhelden-progress-v2")||"{}")}catch(e){return {}}}
function save(v){try{localStorage.setItem("tafelhelden-progress-v2",JSON.stringify(v))}catch(e){}}
function stars(){let v=load(),n=Math.max(0,Math.min(2,v.streak||0));$("stars").textContent="★".repeat(n)+"☆".repeat(3-n);$("streakText").textContent=n+"/3"}
function tables(){$("tables").replaceChildren();for(let n=1;n<=12;n++){let b=document.createElement("button");b.textContent=n;b.className=selected.has(n)?"active":"";b.onclick=()=>{selected.has(n)?selected.delete(n):selected.add(n);tables()};$("tables").append(b)}}
function show(id){for(let x of ["setup","quiz","result"])$(x).classList.toggle("hidden",x!==id)}
function start(){if(!selected.size){$("error").textContent="Kies minstens één tafel";return}$("error").textContent="";let q=[];for(let n of [...selected].sort((a,b)=>a-b))for(let x=1;x<=10;x++)q.push({n,x,answer:n*x});if($("order").value==="random")shuffle(q);let count=$("count").value;if(count!=="all"){let target=+count,base=q.slice();while(q.length<target)q.push(...base.slice(0,target-q.length));q=q.slice(0,target)}questions=q;index=0;correct=0;errors=[];show("quiz");render()}
function render(){answered=false;let q=questions[index];$("progress").textContent="Vraag "+(index+1)+"/"+questions.length;$("score").textContent=correct+" goed";$("question").textContent=q.n+" × "+q.x+" = ?";$("feedback").textContent="";$("next").classList.add("hidden");currentMode=$("mode").value;if(currentMode==="mix")currentMode=index%2?"type":"choice";$("choices").classList.toggle("hidden",currentMode!=="choice");$("entry").classList.toggle("hidden",currentMode!=="type");$("typed").value="";if(currentMode==="choice"){let vals=new Set([q.answer]),candidates=[];for(let n=1;n<=12;n++)for(let x=1;x<=10;x++){let v=n*x;if(v!==q.answer&&Math.abs(v-q.answer)<=25)candidates.push(v)}shuffle(candidates);for(let v of candidates){if(vals.size===4)break;vals.add(v)}while(vals.size<4)vals.add(q.answer+vals.size);$("choices").replaceChildren();for(let v of shuffle([...vals])){let b=document.createElement("button");b.textContent=v;b.onclick=()=>submit(v);$("choices").append(b)}}}
function submit(v){if(answered)return;answered=true;let q=questions[index],ok=v===q.answer;if(ok)correct++;else errors.push({...q,given:v});$("score").textContent=correct+" goed";$("feedback").textContent=ok?"Goed gedaan! 🌟":"Het juiste antwoord is "+q.answer;$("feedback").style.color=ok?"green":"#b91c1c";$("next").textContent=index===questions.length-1?"Bekijk resultaat":"Volgende vraag →";$("next").classList.remove("hidden");for(let b of $("choices").children)b.disabled=true}
function finish(){show("result");$("summary").textContent=correct+" van "+questions.length+" goed ("+Math.round(100*correct/questions.length)+"%).";$("mistakes").replaceChildren();if(errors.length){let h=document.createElement("h3");h.textContent="Deze sommen nog oefenen:";$("mistakes").append(h);for(let q of errors){let p=document.createElement("p");p.textContent=q.n+" × "+q.x+" = "+q.answer+" (jouw antwoord: "+q.given+")";$("mistakes").append(p)}}else $("mistakes").textContent="Alles goed! 🏆";
let v=load();v.streak=v.streak||0;v.completions=v.completions||{};v.jokes=v.jokes||0;
if(errors.length===0){v.streak++;if(v.streak===3){$("joke").textContent="🎁 Je hebt een mop verdiend! "+jokes[v.jokes%jokes.length];$("joke").classList.remove("hidden");v.jokes++;v.streak=0}else{$("joke").classList.add("hidden")}}else{v.streak=0;$("joke").classList.add("hidden")}
// A table is completed once when each of its ten distinct multiplication facts occurred in this session.
for(let n=1;n<=12;n++){let xs=new Set(questions.filter(q=>q.n===n).map(q=>q.x));if(xs.size===10)v.completions[n]=(v.completions[n]||0)+1}
save(v);stars();
try{let h=JSON.parse(localStorage.getItem("tafelhelden-history")||"[]");h.unshift({date:new Date().toLocaleDateString("nl-NL"),correct,total:questions.length});localStorage.setItem("tafelhelden-history",JSON.stringify(h.slice(0,30)))}catch(e){}history()}
function history(){try{let h=JSON.parse(localStorage.getItem("tafelhelden-history")||"[]");$("history").textContent=h.length?h.slice(0,5).map(x=>x.date+": "+x.correct+"/"+x.total+" goed").join("\n"):"Nog geen resultaten"}catch(e){$("history").textContent="Voortgang niet beschikbaar"}
let counts=load().completions||{};$("tableStats").replaceChildren();for(let n=1;n<=12;n++){let div=document.createElement("div");div.className="stat";div.textContent="Tafel "+n+": "+(counts[n]||0)+"×";$("tableStats").append(div)}}
$("all").onclick=()=>{for(let n=1;n<=12;n++)selected.add(n);tables()};$("none").onclick=()=>{selected.clear();tables()};$("start").onclick=start;$("stop").onclick=()=>show("setup");$("again").onclick=()=>show("setup");$("next").onclick=()=>{index++;index<questions.length?render():finish()};$("check").onclick=()=>{if($("typed").value!=="")submit(+$("typed").value)};
for(let v of ["1","2","3","4","5","6","7","8","9","⌫","0","Wis"]){let b=document.createElement("button");b.textContent=v;b.onclick=()=>{if(answered)return;let s=$("typed").value;if(v==="⌫")s=s.slice(0,-1);else if(v==="Wis")s="";else if(s.length<3)s+=v;$("typed").value=s};$("keypad").append(b)}
$("clear").onclick=()=>{if(confirm("Alle voortgang en sterren wissen?")){try{localStorage.removeItem("tafelhelden-history");localStorage.removeItem("tafelhelden-progress-v2")}catch(e){}history();stars()}};
tables();history();stars();if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script></body></html>
