<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.webmanifest"><title>Tafelhelden</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff6ff;color:#172554;font:18px system-ui,sans-serif}main{max-width:700px;margin:auto;padding:20px}h1{font-size:2.5rem}.card{background:white;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 3px 20px #17255415}label{display:block;margin:18px 0 8px;font-weight:700}button,select,input{font:inherit;border:2px solid #cbd5e1;border-radius:12px;padding:13px;background:white;color:inherit}button{cursor:pointer;touch-action:manipulation}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{min-width:60px}.chips .active{background:#bfdbfe;border-color:#2563eb}select,input{width:100%}.primary{background:#2563eb;color:white;border:0;width:100%;padding:18px;font-weight:700;margin-top:12px}.hidden{display:none!important}.question{text-align:center;font-size:clamp(45px,11vw,85px);font-weight:800;margin:30px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices button{font-size:2rem;padding:25px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.keypad button{font-size:1.5rem}#typed{text-align:center;font-size:2rem}#feedback{text-align:center;font-weight:700;min-height:32px;margin:16px}small{color:#64748b}#history{white-space:pre-line}
</style></head><body><main><h1>⭐ Tafelhelden</h1><p>Word een tafelheld!</p><section id="setup" class="card"><h2>Kies je oefening</h2><label>Tafels</label><div id="tables" class="chips"></div><p><button id="all">Alle tafels</button> <button id="none">Wissen</button></p><label>Volgorde</label><select id="order"><option value="ordered">Op volgorde</option><option value="random">Shuffle</option></select><label>Antwoorden</label><select id="mode"><option value="choice">Multiplechoice</option><option value="type">Cijfers invoeren</option><option value="mix">Afwisselend</option></select><label>Aantal vragen</label><select id="count"><option>10</option><option>20</option><option>30</option><option value="all">Alle sommen</option></select><p><small>We oefenen van ×1 tot ×10.</small></p><button id="start" class="primary">Start oefenen</button><p id="error"></p></section><section id="quiz" class="card hidden"><p><strong id="progress"></strong> · <strong id="score"></strong></p><div class="question" id="question"></div><div id="choices" class="choices"></div><div id="entry" class="hidden"><input id="typed" readonly aria-label="Ingevuld antwoord"><div id="keypad" class="keypad"></div><button id="check" class="primary">Controleer</button></div><div id="feedback" aria-live="polite"></div><button id="next" class="primary hidden">Volgende vraag</button><p><button id="stop">Stoppen</button></p></section><section id="result" class="card hidden"><h2>Goed geoefend! 🎉</h2><p id="summary"></p><div id="mistakes"></div><button id="again" class="primary">Opnieuw</button></section><section class="card"><h2>Voortgang</h2><p id="history">Nog geen resultaten</p><button id="clear">Voortgang wissen</button></section></main><script>
(()=>{const $=id=>document.getElementById(id),selected=new Set([2,3,4,5]);let questions=[],index=0,correct=0,errors=[],answered=false,currentMode="choice";const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function tables(){$("tables").replaceChildren();for(let n=1;n<=12;n++){let b=document.createElement("button");b.textContent=n;b.className=selected.has(n)?"active":"";b.onclick=()=>{selected.has(n)?selected.delete(n):selected.add(n);tables()};$("tables").append(b)}}function show(id){for(let x of ["setup","quiz","result"])$(x).classList.toggle("hidden",x!==id)}function start(){if(!selected.size){$("error").textContent="Kies minstens één tafel";return}$("error").textContent="";let q=[];for(let n of [...selected].sort((a,b)=>a-b))for(let x=1;x<=10;x++)q.push({n,x,answer:n*x});if($("order").value==="random")shuffle(q);let count=$("count").value;if(count!=="all"){let target=+count,base=q.slice();while(q.length<target)q.push(...base.slice(0,target-q.length));q=q.slice(0,target)}questions=q;index=0;correct=0;errors=[];show("quiz");render()}function render(){answered=false;let q=questions[index];$("progress").textContent="Vraag "+(index+1)+"/"+questions.length;$("score").textContent=correct+" goed";$("question").textContent=q.n+" × "+q.x+" = ?";$("feedback").textContent="";$("next").classList.add("hidden");currentMode=$("mode").value;if(currentMode==="mix")currentMode=index%2?"type":"choice";$("choices").classList.toggle("hidden",currentMode!=="choice");$("entry").classList.toggle("hidden",currentMode!=="type");$("typed").value="";if(currentMode==="choice"){let vals=new Set([q.answer]),candidates=[];for(let n=1;n<=12;n++)for(let x=1;x<=10;x++){let v=n*x;if(v!==q.answer&&Math.abs(v-q.answer)<=25)candidates.push(v)}shuffle(candidates);for(let v of candidates){if(vals.size===4)break;vals.add(v)}while(vals.size<4)vals.add(q.answer+vals.size);$("choices").replaceChildren();for(let v of shuffle([...vals])){let b=document.createElement("button");b.textContent=v;b.onclick=()=>submit(v);$("choices").append(b)}}}function submit(v){if(answered)return;answered=true;let q=questions[index],ok=v===q.answer;if(ok)correct++;else errors.push({...q,given:v});$("score").textContent=correct+" goed";$("feedback").textContent=ok?"Goed gedaan! 🌟":"Het juiste antwoord is "+q.answer;$("feedback").style.color=ok?"green":"#b91c1c";$("next").textContent=index===questions.length-1?"Bekijk resultaat":"Volgende vraag →";$("next").classList.remove("hidden");for(let b of $("choices").children)b.disabled=true}function finish(){show("result");$("summary").textContent=correct+" van "+questions.length+" goed ("+Math.round(100*correct/questions.length)+"%).";$("mistakes").replaceChildren();if(errors.length){let h=document.createElement("h3");h.textContent="Deze sommen nog oefenen:";$("mistakes").append(h);for(let q of errors){let p=document.createElement("p");p.textContent=q.n+" × "+q.x+" = "+q.answer+" (jouw antwoord: "+q.given+")";$("mistakes").append(p)}}else $("mistakes").textContent="Alles goed! 🏆";try{let h=JSON.parse(localStorage.getItem("tafelhelden-history")||"[]");h.unshift({date:new Date().toLocaleDateString("nl-NL"),correct,total:questions.length});localStorage.setItem("tafelhelden-history",JSON.stringify(h.slice(0,30)))}catch(e){}history()}function history(){try{let h=JSON.parse(localStorage.getItem("tafelhelden-history")||"[]");$("history").textContent=h.length?h.slice(0,5).map(x=>x.date+": "+x.correct+"/"+x.total+" goed").join("\n"):"Nog geen resultaten"}catch(e){$("history").textContent="Voortgang niet beschikbaar"}}$("all").onclick=()=>{for(let n=1;n<=12;n++)selected.add(n);tables()};$("none").onclick=()=>{selected.clear();tables()};$("start").onclick=start;$("stop").onclick=()=>show("setup");$("again").onclick=()=>show("setup");$("next").onclick=()=>{index++;index<questions.length?render():finish()};$("check").onclick=()=>{if($("typed").value!=="")submit(+$("typed").value)};for(let v of ["1","2","3","4","5","6","7","8","9","⌫","0","Wis"]){let b=document.createElement("button");b.textContent=v;b.onclick=()=>{if(answered)return;let s=$("typed").value;if(v==="⌫")s=s.slice(0,-1);else if(v==="Wis")s="";else if(s.length<3)s+=v;$("typed").value=s};$("keypad").append(b)}$("clear").onclick=()=>{if(confirm("Voortgang wissen?")){try{localStorage.removeItem("tafelhelden-history")}catch(e){}history()}};tables();history();if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{})})();
</script></body></html>
